<script>
/* Segmented progress bar: one segment per major section of the talk.
 *
 * The default reveal.js progress bar is a single 3px line. It is hard to read
 * from the back of a room and says nothing about where you are in the talk.
 * This replaces it with one segment per level-1 section ("Act 1", ...), sized
 * by the number of slides it contains and filled as the talk advances.
 *
 * Sections are discovered from the rendered deck, so adding or removing slides
 * needs no change here: a new `# Heading` becomes a new segment automatically.
 * Slides before the first level-1 heading are grouped into "Introduction".
 */
(function () {
  "use strict";

  const INTRO_LABEL = "Introduction";

  // A slide is either a top-level <section> or nested inside one (Quarto wraps
  // every `# Heading` and the slides under it in a single <section>).
  function topLevelSection(slide) {
    let el = slide;
    while (el.parentElement && !el.parentElement.classList.contains("slides")) {
      el = el.parentElement;
    }
    return el;
  }

  function collectSections() {
    const sections = [];

    Reveal.getSlides().forEach((slide, index) => {
      const top = topLevelSection(slide);
      const last = sections[sections.length - 1];

      if (last && last.element === top) {
        last.end = index;
        return;
      }

      // The title slide also has an <h1>, but it is not a section heading.
      const heading =
        top.id === "title-slide" ? null : top.querySelector("h1");

      sections.push({
        element: top,
        slide: slide,
        label: heading ? heading.textContent.trim() : null,
        start: index,
        end: index,
      });
    });

    // Everything before the first act is the introduction: the title slide,
    // `whoami`, the skrub intro and the roadmap.
    const firstAct = sections.findIndex((section) => section.label);
    if (firstAct > 0) {
      const intro = sections.slice(0, firstAct);
      sections.splice(0, firstAct, {
        element: intro[0].element,
        slide: intro[0].slide,
        label: INTRO_LABEL,
        start: intro[0].start,
        end: intro[intro.length - 1].end,
      });
    }

    return sections;
  }

  function build(sections) {
    const bar = document.createElement("div");
    bar.className = "progress-sections";

    sections.forEach((section) => {
      const segment = document.createElement("div");
      segment.className = "segment";
      // Proportional widths: a long act gets a long segment.
      segment.style.flexGrow = String(section.end - section.start + 1);
      segment.title = section.label;
      segment.addEventListener("click", () => {
        const indices = Reveal.getIndices(section.slide);
        Reveal.slide(indices.h, indices.v);
      });

      const fill = document.createElement("div");
      fill.className = "segment-fill";
      segment.appendChild(fill);

      section.segment = segment;
      section.fill = fill;
      bar.appendChild(segment);
    });

    const label = document.createElement("div");
    label.className = "progress-sections-label";

    const reveal = document.querySelector(".reveal");
    reveal.appendChild(bar);
    reveal.appendChild(label);

    return label;
  }

  function update(sections, label) {
    const index = Reveal.getSlides().indexOf(Reveal.getCurrentSlide());

    sections.forEach((section) => {
      const total = section.end - section.start + 1;
      let progress = 0;
      if (index > section.end) {
        progress = 1;
      } else if (index >= section.start) {
        progress = (index - section.start + 1) / total;
      }

      section.fill.style.transform = "scaleX(" + progress + ")";
      section.segment.classList.toggle(
        "active",
        index >= section.start && index <= section.end
      );
    });

    const current = sections.find(
      (section) => index >= section.start && index <= section.end
    );
    // On the act's own divider slide the heading already says the name.
    const onDivider = current && index === current.start;
    label.textContent = current && !onDivider ? current.label : "";
  }

  function setup() {
    const sections = collectSections();
    const label = build(sections);
    update(sections, label);
    Reveal.on("slidechanged", () => update(sections, label));
  }

  // The script is inlined after Reveal.initialize(), so Reveal may or may not
  // have fired "ready" by the time it runs.
  function whenReady(callback) {
    if (window.Reveal && Reveal.isReady && Reveal.isReady()) {
      callback();
    } else if (window.Reveal && Reveal.on) {
      Reveal.on("ready", callback);
    } else {
      window.setTimeout(() => whenReady(callback), 50);
    }
  }

  whenReady(setup);
})();
</script>
