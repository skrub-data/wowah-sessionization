project:
  type: website
  title: "WoWAH Player Churn Prediction"
  output-dir: docs
  # Code cells run with the project root as cwd even when the document lives in
  # a subfolder, so `data/...` paths stay identical across the whole series.
  execute-dir: project
  render:
    - "*.qmd"
    # Shared partials included by the parts in posts/; not published standalone.
    - "!sections/**"
  resources:
    - "reports/**"

website:
  title: "WoWAH Player Churn Prediction"
  site-url: https://skrub-data.org/wowah-sessionization/
  repo-url: https://github.com/skrub-data/wowah-sessionization
  repo-actions: [source]
  navbar:
    title: "WoWAH Churn Prediction"
    search: true
    left:
      - text: "Home"
        href: index.html
      - text: "Blog post"
        href: draft.html
      - text: "Slides"
        href: skrub-dataops.html

format:
  html:
    theme: cosmo
    code-fold: false
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github
    self-contained: false
    smooth-scroll: true
    css: style.css

execute:
  freeze: auto
  cache: true

jupyter: python3
