project:
  type: website
  title: "WoWAH Player Churn Prediction"
  output-dir: docs
  render:
    - "*.qmd"
    # Draft sections are included into draft.qmd; do not publish them standalone.
    - "!sections/**"
  resources:
    - "reports/**"

website:
  title: "WoWAH Player Churn Prediction"
  site-url: https://www.riccardocappuzzo.com/wowah-sessionization/
  repo-url: https://github.com/rcap107/wowah-sessionization
  repo-actions: [source]
  navbar:
    title: "WoWAH Churn Prediction"
    search: true
    left:
      - text: "Home"
        href: index.html
      - text: "Blog post"
        href: draft.html
      - text: "Slides"
        href: skrub-dataops.html

format:
  html:
    theme: cosmo
    code-fold: false
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github
    self-contained: false
    smooth-scroll: true
    css: style.css

execute:
  freeze: auto
  cache: true

jupyter: python3
