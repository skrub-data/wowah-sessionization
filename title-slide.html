<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
    <h1 class="title">$title$</h1>
    $if(subtitle)$
    <p class="subtitle">$subtitle$</p>
    $endif$
    $for(author)$
    <p class="author">$author$</p>
    $endfor$
    $for(institute)$
    <p class="institute">$institute$</p>
    $endfor$
    $if(date)$
    <p class="date">$date$</p>
    $endif$
    <div class="title-logos">
        <img src="images/skrub.svg" class="title-logo" alt="skrub" />
        <img src="images/probabl-logo.svg" class="title-logo" alt="probabl" />
        <img src="images/inria-logo.jpg" class="title-logo" alt="inria" />
    </div>
</section>
